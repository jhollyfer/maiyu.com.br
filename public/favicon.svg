<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Forest dark background -->
  <rect width="32" height="32" rx="7" fill="#080f0b"/>

  <!-- Subtle inner border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- M lettermark — serif, amber -->
  <text
    x="15"
    y="23"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="700"
    fill="#d4920c"
    text-anchor="middle"
    letter-spacing="-0.5"
  >M</text>

  <!-- Amber dot — the "Maiyu." period -->
  <circle cx="22.5" cy="23" r="1.8" fill="#d4920c"/>
</svg>
