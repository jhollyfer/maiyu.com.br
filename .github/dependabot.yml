# One npm block for the whole workspace and one for the Docker bases pinned by digest
# (`_standards/tooling.md` §9). No `github-actions` block: a house project has no workflow
# (DECISIONS.md #298). TypeScript major stays out (§0).
version: 2

updates:
  - package-ecosystem: npm
    directories: [/backend, /frontend, /shared, /]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: [patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /backend/infra/minio]
    schedule:
      interval: weekly
