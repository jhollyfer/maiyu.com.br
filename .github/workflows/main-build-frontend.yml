name: Build Frontend

# The steps are the check's (`main-check-frontend.yml`), plus the revision stamp and the
# `.output` artifact that the image packages (`_standards/tooling.md` §8.1, §8.3). Calling the
# same reusable keeps a single gate for the PR and the deploy.
on:
  workflow_call:
    secrets:
      VITE_SITE_URL:
        required: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/main-check-frontend.yml
    with:
      publish: true
    secrets:
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
