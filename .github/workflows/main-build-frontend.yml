name: Build Frontend

# Temporário: publica o site anterior (`frontend-old/`, nginx na porta 80)
# enquanto a aplicação no Coolify não troca para a imagem Nitro na porta 3000.
# A cadeia do frontend novo volta com o commit c6d6803.
on:
  workflow_call:

jobs:
  build:
    name: Compile & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-old/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-old
        run: npm install

      - name: Build
        working-directory: ./frontend-old
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          retention-days: 1
          path: |
            frontend-old/dist/
          include-hidden-files: true
