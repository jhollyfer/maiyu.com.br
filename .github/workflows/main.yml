name: Build, Docker and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `build-frontend` → `docker-frontend` → `deploy` (`_standards/tooling.md` §8.1). Profile
# without `backend/` (`DECISIONS.md` #286): no API to check, package or deploy.
jobs:
  build-frontend:
    uses: ./.github/workflows/main-build-frontend.yml
    secrets:
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}

  docker-frontend:
    needs: build-frontend
    uses: ./.github/workflows/main-docker-frontend.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # After the image is on Docker Hub, and not before.
  deploy-to-coolify:
    needs: docker-frontend
    uses: ./.github/workflows/main-deploy-coolify.yml
    secrets:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
