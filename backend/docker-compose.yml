# Local infrastructure only (database and test bucket); the application runs outside of
# here, with `pnpm dev` (`_standards/tooling.md` §8.4). Own ports (5440, 9016, 9017), the
# next free line of the house table, to coexist with another project on the same machine,
# always bound to 127.0.0.1.
name: maiyu-backend

services:
  database:
    image: postgres:18-alpine
    container_name: maiyu-backend-database
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: maiyu
      POSTGRES_DB: maiyu
      POSTGRES_USER: maiyu
    ports:
      - '127.0.0.1:${DB_PORT:-5440}:5432'
    volumes:
      # Postgres 18 keeps the data in a versioned folder under this path.
      - maiyu-backend-database-volume:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maiyu -d maiyu']
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible bucket for dev and e2e: the upload is presigned multipart, an S3 API
  # that the local disk does not have. Never goes to production, which uses S3 or R2.
  # The image is built from source at a pinned release (`infra/minio/`).
  minio:
    build: ./infra/minio
    image: maiyu-minio-test:2025-10-15
    container_name: maiyu-backend-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The browser sends each part straight here: without CORS, the PUT preflight dies
      # before any byte leaves.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:3000}
      # An abandoned multipart upload disappears on its own.
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 6h
    ports:
      - '127.0.0.1:${STORAGE_PORT:-9016}:9000'
      - '127.0.0.1:${STORAGE_CONSOLE_PORT:-9017}:9001'
    volumes:
      - maiyu-backend-minio-volume:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9000/minio/health/live',
        ]
      interval: 5s
      retries: 10

  # Creates the buckets and the application's minimum-scope user. Runs once and exits.
  minio-setup:
    image: maiyu-minio-test:2025-10-15
    container_name: maiyu-backend-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/setup/minio-setup.sh', 'http://minio:9000']
    env_file: .env
    volumes:
      - ./infra/minio:/setup:ro

volumes:
  maiyu-backend-database-volume:
    driver: local
  maiyu-backend-minio-volume:
    driver: local
