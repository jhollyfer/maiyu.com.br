# Local infrastructure only (database, test bucket and, with the queue, Redis); the
# application runs outside of it, with `pnpm dev` (`_standards/tooling.md` §8.4).
# Extension point: the sync creates it once, with this project's ports from the
# house table (`PROJECT_PORTS` in the upstream `scripts/kit-manifest.mjs`), and
# never rewrites it. Every port is bound to 127.0.0.1, never to the whole network.
name: maiyu-backend

services:
  # User, password and database are literals equal to the default DATABASE_URL of
  # `.env.example` (`postgres://app:app@localhost:<port>/app`): a credential of this
  # machine only, reachable only from 127.0.0.1, never a production secret, so it
  # needs no key of its own in the ENV catalog (DECISIONS.md #417). The password is
  # checked on every TCP connection (no `trust`, POSTGRES_HOST_AUTH_METHOD unset).
  database:
    image: postgres:18-alpine
    container_name: maiyu-backend-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      # From 18 on the image keeps PGDATA under /var/lib/postgresql/18/docker and
      # declares the volume at /var/lib/postgresql: the mount goes there.
      - maiyu-backend-database-volume:/var/lib/postgresql
      # `app_test`, the suite database, on the first start of an empty volume.
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible bucket for dev and e2e: the upload is presigned multipart, an S3
  # API that the local disk does not have. Never goes to production, which uses S3
  # or R2. The image is built from source at a pinned release (`infra/minio/`).
  minio:
    build: ./infra/minio
    image: maiyu-minio-test:2025-10-15
    container_name: maiyu-backend-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The browser sends each part straight here: without CORS, the PUT
      # preflight dies before any byte leaves.
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-http://localhost:3000}
      # An abandoned multipart upload disappears on its own.
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 6h
    ports:
      - '127.0.0.1:9016:9000'
      - '127.0.0.1:9017:9001'
    volumes:
      - maiyu-backend-minio-volume:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9000/minio/health/live',
        ]
      interval: 5s
      retries: 10

  # Creates the buckets and the application's minimum-scope user. Runs once and exits.
  minio-setup:
    image: maiyu-minio-test:2025-10-15
    container_name: maiyu-backend-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/setup/minio-setup.sh', 'http://minio:9000']
    env_file: .env
    volumes:
      - ./infra/minio:/setup:ro

volumes:
  maiyu-backend-database-volume:
    driver: local
  maiyu-backend-minio-volume:
    driver: local
